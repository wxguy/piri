name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  standalone-linux:
    name: Linux standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools and native backends
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cpio \
            gzip \
            bzip2 \
            xz-utils \
            zstd \
            lz4 \
            pigz \
            pbzip2 \
            zip \
            p7zip-full \
            libarchive-tools \
            qemu-utils \
            e2fsprogs \
            squashfs-tools
      - run: python -m pip install --upgrade pip pyinstaller
      - run: bash build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-linux-x86_64
          path: release/*

  standalone-windows:
    name: Windows standalone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native archive backend
        shell: pwsh
        run: choco install 7zip -y --no-progress
      - run: python -m pip install --upgrade pip pyinstaller
      - run: .\build\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-x86_64
          path: release/*

  standalone-macos:
    name: macOS standalone
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native archive backend
        run: |
          brew install zstd xz bzip2 lz4 pigz p7zip libarchive || true
      - run: python -m pip install --upgrade pip pyinstaller
      - run: bash build/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-macos-arm64
          path: release/*

  release:
    name: Publish release
    needs: [standalone-linux, standalone-windows, standalone-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: artifacts/standalone
          merge-multiple: true
      - uses: actions/checkout@v4
      - name: Verify artifacts
        run: |
          find artifacts -type f -maxdepth 2 -print
          test -n "$(find artifacts -type f | head -1)"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/standalone/*
