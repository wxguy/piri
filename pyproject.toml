[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piri"
version = "1.0.0"
description = "A practical, security-conscious archive CLI with native compressor backends."
keywords = ["archive", "compression", "tar", "zip", "cli", "backup", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Compression",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "WxGuy"}]
dependencies = []

[project.scripts]
piri = "piri.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build>=1", "twine>=6"]

[project.urls]
Homepage = "https://github.com/wxguy/piri"
Repository = "https://github.com/wxguy/piri"
Issues = "https://github.com/wxguy/piri/issues"
Changelog = "https://github.com/wxguy/piri/blob/main/CHANGELOG.md"
Author = "https://wxguy.in/"

[tool.setuptools.packages.find]
include = ["piri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
